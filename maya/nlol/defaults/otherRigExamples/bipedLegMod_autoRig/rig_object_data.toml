# RIG OBJECT DATA: Biped Leg Example

# ---------- main ----------
[[rig_module]]
rig_module = "world_control_mod" 
rig_module_name = "world" 

[[rig_module]]
rig_module = "fk_control_mod" 
rig_module_name = "global" 
joints = "root"
constraint = false

[[rig_module]]
rig_module = "fk_control_mod" 
rig_module_name = "root" 
joints = "root"

[[rig_module]]
rig_module = "fk_control_mod" 
rig_module_name = "cog" 
joints = "cog_loc"
constraint = false
display_layer = true

[[rig_module]]
rig_module = "fk_control_mod" 
rig_module_name = "pelvis" 
joints = "pelvis"

